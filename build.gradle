plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'jacoco'
    alias libs.plugins.modDevGradle
    //alias libs.plugins.shadow
    alias libs.plugins.spotless
    alias libs.plugins.lombok
}

group = maven_group
// Formats the mod version to include the loader, Minecraft version, and '-SNAPSHOT-<timestamp>' if enabled.
boolean isSnapshot = System.getenv("SNAPSHOT")
version = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")
boolean isCI = System.getenv("CI") != null

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
    // Include resources generated by data generators.
    main.resources {
        srcDir 'src/generated/resources'
    }

    // The currently pinned AE2, KubeJS and FTB Chunks artifacts target the old Forge API.
    // Keep their source in the repository while building the 26.2 core by default.
    // Opt in after compatible dependencies and source ports are available.
    if (!providers.gradleProperty('includeLegacyIntegrations').isPresent()) {
        main.resources.exclude 'kubejs.plugins.txt'
        main.java.exclude(
                'com/gregtechceu/gtceu/integration/ae2/**',
                'com/gregtechceu/gtceu/integration/create/**',
                'com/gregtechceu/gtceu/integration/map/ftbchunks/**',
                'com/gregtechceu/gtceu/core/mixins/ftbchunks/**',
                'com/gregtechceu/gtceu/integration/kjs/GregTechKubeJSPlugin.java',
                'com/gregtechceu/gtceu/integration/kjs/recipe/GTRecipeSchema.java',
                'com/gregtechceu/gtceu/integration/kjs/recipe/WrappingRecipeSchemaType.java',
                'com/gregtechceu/gtceu/integration/kjs/builders/block/ActiveBlockBuilder.java',
                'com/gregtechceu/gtceu/integration/kjs/builders/block/CoilBlockBuilder.java',
                'com/gregtechceu/gtceu/common/data/machines/GTAEMachines.java',
                'com/gregtechceu/gtceu/integration/jade/provider/MEGridConnectedProvider.java',
                'com/gregtechceu/gtceu/integration/jade/provider/MEPatternBufferProvider.java',
                'com/gregtechceu/gtceu/integration/jade/provider/MEPatternBufferProxyProvider.java')
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    clientExtra {
        compileClasspath += client.output + extra.compileClasspath
        runtimeClasspath += client.output + client.runtimeClasspath + extra.runtimeClasspath
    }
}

configurations {
    // set these as unresolvable so we don't accidentally force all dependents to use them with us
    clientRuntimeOnly.canBeResolved = false
    extraRuntimeOnly.canBeResolved = false
    clientExtraRuntimeOnly.canBeResolved = false

    runtimeClasspath.extendsFrom localRuntime
    extraRuntimeClasspath.extendsFrom extraLocalRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    clientExtraRuntimeClasspath.extendsFrom clientExtraLocalRuntime

    renderNurseCfg {
        canBeConsumed = false
    }
}


apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"
apply from: "$rootDir/gradle/scripts/docs.gradle"
apply from: "$rootDir/gradle/scripts/port-diagnostics.gradle"


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-removal"
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
    if (providers.gradleProperty('portDiagnostics').isPresent()) {
        options.incremental = false
        options.fork = true
        options.forkOptions.executable = javaCompiler.get().executablePath.asFile.absolutePath
        // Early enter/type errors otherwise stop annotation processing, producing thousands of
        // false missing-Lombok-method cascades. Diagnostic mode continues through processing and
        // attribution; the build still fails on errors. Keep this javac-internal option opt-in.
        options.compilerArgs.addAll(['-Xmaxerrs', '10000', '-Xmaxwarns', '20', '-XDshould-stop.ifError=FLOW'])
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

lombok {
    version = "1.18.42"
}

jacoco {
    applyTo runGameTestServer
}

jacocoTestReport {
    doFirst {
        try {
            runGameTestServer.exec()
        } catch (RuntimeException ignored) {}
    }
    doLast {
        println "Coverage report location:"
        println " - file://${layout.buildDirectory.dir('coverage').map(a -> a.file('index.html')).get()}"
        println " - file://${layout.buildDirectory.dir('coverage').map(a -> a.file('coverage.xml')).get()}"
    }
    executionData runGameTestServer
    sourceSets sourceSets.test
    reports {
        csv.required = false
        xml.required = true
        html.outputLocation = layout.buildDirectory.dir('coverage')
        xml.outputLocation = layout.buildDirectory.dir('coverage').map(a -> a.file('coverage.xml'))
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: '**/client/**')
            fileTree(dir: it, exclude: '**/mixins/**')
        }))
    }
}
