// Compile the actual GT data layer using the existing NeoForge test loader, without loading the unfinished GT mod.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def gtRoot = project.projectDir.parentFile.parentFile
    project.sourceSets.test.java.srcDir(new File(gtRoot, 'src/main/java'))
    project.sourceSets.test.java.srcDir(new File(gtRoot, 'src/test/java'))
    project.sourceSets.test.java.setIncludes([
        'brachy/**',
        'com/gregtechceu/gtceu/api/item/data/**',
        'com/gregtechceu/gtceu/api/GTVoltages.java',
        'com/gregtechceu/gtceu/api/capability/IElectricItem.java',
        'com/gregtechceu/gtceu/api/capability/IEnergyContainer.java',
        'com/gregtechceu/gtceu/api/capability/IEnergyInfoProvider.java',
        'com/gregtechceu/gtceu/api/capability/IBlockEnergyProvider.java',
        'com/gregtechceu/gtceu/api/capability/BlockEnergyCapabilities.java',
        'com/gregtechceu/gtceu/api/capability/EnergyNetworkTransfer.java',
        'com/gregtechceu/gtceu/api/capability/ElectricItemCapabilities.java',
        'com/gregtechceu/gtceu/api/item/capability/ElectricItem.java'
    ])
    if (project.hasProperty('itemComponentTestAssetProperties')) {
        project.tasks.named('prepareNeoForgeTestFiles') {
            assetProperties.set(project.file(project.property('itemComponentTestAssetProperties')))
        }
    }
}
