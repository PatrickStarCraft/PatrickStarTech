// Exercise the selected production persisted-mode ordinal helper independently of player interaction.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def gtRoot = project.projectDir.parentFile.parentFile
    def selectedProductionSources = project.fileTree(new File(gtRoot, 'src/main/java')) {
        include 'com/gregtechceu/gtceu/common/item/tool/behavior/OrdinalModeData.java'
    }
    project.sourceSets.test.java.setSrcDirs([new File(gtRoot, 'src/test/java')])
    project.sourceSets.test.java.setIncludes([
        'com/gregtechceu/gtceu/common/item/tool/behavior/OrdinalModeDataPortTest.java'
    ])
    project.tasks.named('compileTestJava') {
        source(selectedProductionSources)
    }
}
