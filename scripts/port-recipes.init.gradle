// Exercise selected GT recipe classes using the working NeoForge test loader.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def gtRoot = project.projectDir.parentFile.parentFile
    def selectedProductionSources = project.fileTree(new File(gtRoot, 'src/main/java')) {
        include 'com/gregtechceu/gtceu/api/sync_system/NBTSerializable.java'
        include 'com/gregtechceu/gtceu/api/sync_system/ValueIOPersistence.java'
        include 'com/gregtechceu/gtceu/api/sync_system/CompoundTagSavedData.java'
        include 'com/gregtechceu/gtceu/utils/data/TypedTagList.java'
        include 'com/gregtechceu/gtceu/utils/data/StackPersistence.java'
        include 'com/gregtechceu/gtceu/utils/data/ComponentJson.java'
        include 'com/gregtechceu/gtceu/api/transfer/fluid/FluidHandlerList.java'
        include 'com/gregtechceu/gtceu/api/transfer/item/CustomItemStackHandler.java'
        include 'com/gregtechceu/gtceu/api/transfer/fluid/CustomFluidTank.java'
        include 'com/gregtechceu/gtceu/api/transfer/fluid/IFluidHandlerModifiable.java'
        include 'com/gregtechceu/gtceu/api/capability/recipe/IO.java'
        include 'com/gregtechceu/gtceu/api/misc/IOFluidHandlerList.java'
        include 'com/gregtechceu/gtceu/data/recipe/GeneratedRecipe.java'
        include 'com/gregtechceu/gtceu/data/recipe/GeneratedRecipeOutput.java'
        include 'com/gregtechceu/gtceu/data/recipe/builder/RecipeBuilderCodecs.java'
        include 'com/gregtechceu/gtceu/data/recipe/builder/ShapedRecipeBuilder.java'
        include 'com/gregtechceu/gtceu/data/recipe/builder/ShapelessRecipeBuilder.java'
        include 'com/gregtechceu/gtceu/data/recipe/builder/SimpleCookingRecipeBuilder.java'
        include 'com/gregtechceu/gtceu/data/recipe/builder/ShapedEnergyTransferRecipeBuilder.java'
        include 'com/gregtechceu/gtceu/api/recipe/ShapedEnergyTransferRecipe.java'
        include 'com/gregtechceu/gtceu/api/capability/ElectricItemCapabilities.java'
        include 'com/gregtechceu/gtceu/api/capability/IElectricItem.java'
        include 'com/gregtechceu/gtceu/api/item/data/ElectricItemData.java'
        include 'com/gregtechceu/gtceu/api/item/data/ItemStackData.java'
        include 'com/gregtechceu/gtceu/api/item/capability/ElectricItem.java'
        include 'com/gregtechceu/gtceu/api/GTVoltages.java'
        include 'com/gregtechceu/gtceu/api/recipe/StrictShapedRecipe.java'
        include 'com/gregtechceu/gtceu/api/recipe/CraftingGridOrigin.java'
        include 'com/gregtechceu/gtceu/api/recipe/RecipeIdAware.java'
        include 'com/gregtechceu/gtceu/api/recipe/ResearchData.java'
        include 'com/gregtechceu/gtceu/api/recipe/content/RecipeContentCodec.java'
        include 'com/gregtechceu/gtceu/core/mixins/CraftingInputMixin.java'
        include 'com/gregtechceu/gtceu/core/mixins/RecipeHolderMixin.java'
        include 'com/gregtechceu/gtceu/core/mixins/PlaceRecipeHelperMixin.java'
    }
    project.sourceSets.test.java.setSrcDirs([
        new File(gtRoot, 'src/test/java'),
        new File(gtRoot, 'scripts/port-recipe-test-fixtures')
    ])
    project.sourceSets.test.java.setIncludes([
        'brachy/**',
        'com/gregtechceu/gtceu/GTCEu.java',
        'com/gregtechceu/gtceu/api/recipe/InventoryPersistencePortTest.java',
        'com/gregtechceu/gtceu/api/recipe/RecipeBuilderPortTest.java',
        'com/gregtechceu/gtceu/api/recipe/GeneratedRecipePortTest.java',
        'com/gregtechceu/gtceu/api/recipe/ResearchDataPortTest.java',
        'com/gregtechceu/gtceu/api/recipe/RecipeContentCodecPortTest.java',
        'com/gregtechceu/gtceu/api/recipe/StrictShapedRecipePortTest.java'
    ])
    project.tasks.named('compileTestJava') {
        source(selectedProductionSources)
    }
    project.sourceSets.test.resources.srcDir(new File(gtRoot, 'scripts/port-recipe-test-resources'))
    project.tasks.named('processResources') {
        inputs.property('gtRecipePortTests', true)
        from(new File(gtRoot, 'scripts/port-recipe-test-resources'))
        filesMatching('META-INF/neoforge.mods.toml') {
            filter { line ->
                line == 'config = "modularui.mixins.json"' ?
                    line + '\n[[mixins]]\nconfig = "gtceu-port-recipes.mixins.json"' : line
            }
        }
    }
}
